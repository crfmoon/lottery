name: Update DLT Data

# 开奖次日晚自动更新；也可在 Actions 页面手动触发
on:
  schedule:
    # 北京时间开奖次日（周二/四/日）00:30，UTC 仍为开奖当天
    - cron: "30 16 * * 1,3,6"
    # 北京时间开奖次日 08:30 再检查一次，回补延迟发布的数据
    - cron: "30 0 * * 2,4,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dlt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 抓取可能被官方站点安全策略拦截（HTTP 567），失败也要继续走到提交步骤，
      # 把失败状态写回仓库，避免「静默停更」
      - name: 抓取并生成数据
        working-directory: data
        continue-on-error: true
        run: python update_data.py

      - name: 提交更新
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.js docs/index.html data/dlt_history.csv
          if [ -f docs/update-status.json ]; then git add docs/update-status.json; fi
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: auto update dlt data"
            git pull --rebase --autostash origin main || true
            git push || { sleep 5; git pull --rebase --autostash origin main || true; git push; }
          fi

      - name: 输出更新状态
        if: always()
        run: |
          echo "----- docs/update-status.json -----"
          cat docs/update-status.json 2>/dev/null || echo "（无状态文件）"

      # 抓取步骤用了 continue-on-error，这里按状态文件把任务标记为失败，
      # 保证 Actions 页面能直接看到红叉而不是误报成功
      - name: 检查更新结果
        if: always()
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path("docs/update-status.json")
          if not path.exists():
              print("缺少状态文件，无法判断更新结果")
              sys.exit(1)
          data = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          sys.exit(0 if data.get("ok") else 1)
          PY
