name: Update DLT Data

# 开奖日晚自动更新数据并发布；也可在 Actions 页面手动触发
on:
  schedule:
    # 大乐透每周一/三/六开奖（北京时间约 21:25），此处用 UTC 14:00 ≈ 北京 22:00
    - cron: "0 14 * * 1,3,6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取并生成数据
        run: |
          cd data
          python gather_dlt.py
          python gen_data.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.js docs/index.html data/dlt_history.csv
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: auto update dlt data"
            git push
          fi
