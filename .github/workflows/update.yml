name: Update DLT Data

# 开奖次日自动更新数据；也可在 Actions 页面手动触发
on:
  schedule:
    # 北京时间开奖次日（周二/四/日）00:30，UTC 仍为开奖当天。
    - cron: "30 16 * * 1,3,6"
    # 北京时间开奖次日 08:30 再检查一次，回补延迟发布的数据。
    - cron: "30 0 * * 2,4,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dlt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取并生成数据
        working-directory: data
        run: |
          python update_data.py

      - name: 提交更新
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.js docs/index.html data/dlt_history.csv
          if [ -f docs/update-status.json ]; then git add docs/update-status.json; fi
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: auto update dlt data"
            git push
          fi
