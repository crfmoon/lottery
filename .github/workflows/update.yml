name: Update DLT Data

# 开奖日晚自动更新数据并发布；也可在 Actions 页面手动触发
on:
  schedule:
    # 大乐透在周一/三/六开奖。等到开奖次日凌晨再抓取，确保销售额、奖池和
    # 奖级明细已由官方接口补齐；UTC 周二/四/日 16:30 = 北京次日 00:30。
    - cron: "30 16 * * 2,4,0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取并生成数据
        working-directory: data
        run: |
          python gather_dlt.py
          python gen_data.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.js docs/index.html data/dlt_history.csv
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: auto update dlt data"
            git push
          fi
